<!DOCTYPE html>
<html>
<body>

<h2>JSBridge 深度测试</h2>
<pre id="log"></pre>

<script>
function log(msg) {
    document.getElementById("log").innerHTML += msg + "\n";
}

log("页面加载");

// 监听桥初始化
document.addEventListener('ToutiaoJSBridgeReady', function () {
    log("✅ ToutiaoJSBridge Ready");

    try {
        log("桥对象: " + JSON.stringify(window.ToutiaoJSBridge));

        // 尝试不同调用方式
        if (window.ToutiaoJSBridge.call) {
            window.ToutiaoJSBridge.call('device.getInfo', {}, function(res){
                log("call 返回: " + JSON.stringify(res));
            });
        } else {
            log("没有 call 方法");
        }

    } catch (e) {
        log("调用异常: " + e);
    }
}, false);


// fallback（有些版本不触发事件）
setTimeout(function() {
    if (window.ToutiaoJSBridge) {
        log("⚠️ fallback 发现 bridge");

        try {
            if (window.ToutiaoJSBridge.call) {
                window.ToutiaoJSBridge.call('device.getInfo', {}, function(res){
                    log("fallback 返回: " + JSON.stringify(res));
                });
            }
        } catch(e) {
            log("fallback error: " + e);
        }
    }
}, 3000);

</script>

</body>
</html>
