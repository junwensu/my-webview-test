<script>
function log(msg) {
    document.body.innerHTML += msg + "<br>";
}

// 等待 bridge ready
document.addEventListener('ToutiaoJSBridgeReady', function () {
    log("Bridge Ready");

    let bridge = window.ToutiaoJSBridge;

    // 👇 枚举所有方法（关键）
    for (let k in bridge) {
        try {
            log("方法: " + k + " => " + typeof bridge[k]);
        } catch(e){}
    }

    // 👇 尝试几种常见调用方式
    try {
        if (bridge.call) {
            bridge.call("device.getInfo", {}, function(res){
                log("call 成功: " + JSON.stringify(res));
            });
        }
    } catch(e) {
        log("call error: " + e);
    }

}, false);


// fallback
setTimeout(function(){
    if (window.ToutiaoJSBridge) {
        log("fallback bridge 存在");

        let bridge = window.ToutiaoJSBridge;

        for (let k in bridge) {
            log("fallback 方法: " + k);
        }
    }
}, 3000);
</script>
